
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Flareminds Billing API</title>
</head>

<body style="margin:0; padding:0; background:#edf6fc; color:#1e293b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">

  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box;">

    <div style="width:100%; max-width:620px; background:#fcfeff; border:1px solid #d7eaf7; border-radius:14px; box-shadow:0 10px 35px rgba(48, 117, 158, 0.08); overflow:hidden;">

      <!-- Header -->
      <div style="padding:28px 32px 24px; border-bottom:1px solid #e3f0f8; display:flex; align-items:center; justify-content:space-between; gap:20px;">

        <div>
          <div style="font-size:18px; font-weight:650; letter-spacing:-0.2px; color:#163247;">
            Flareminds
          </div>

          <div style="margin-top:4px; font-size:13px; color:#7090a5;">
            Billing API
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:8px; padding:6px 11px; background:#eaf7ff; border:1px solid #ccecff; border-radius:999px; font-size:12px; font-weight:600; color:#1674a8;">
          <span style="width:7px; height:7px; background:#38df67; border-radius:50%; display:inline-block;"></span>
          Operational
        </div>

      </div>

      <!-- Main -->
      <div style="padding:42px 32px 38px;">

        <div style="width:48px; height:48px; display:flex; align-items:center; justify-content:center; background:#e9f6fd; border:1px solid #cdeafa; border-radius:50%; margin-bottom:22px;">

          <span style="font-size:22px; line-height:1; color:#1688bd; font-weight:700;">
            ✓
          </span>

        </div>

        <h1 style="margin:0; font-size:28px; line-height:1.25; letter-spacing:-0.7px; font-weight:650; color:#17384d;">
          API is online
        </h1>

        <p style="margin:12px 0 0; max-width:500px; font-size:15px; line-height:1.7; color:#6d8799;">
          The Flareminds Billing API is running normally and is ready to process requests.
        </p>

        <!-- Status -->
        <div style="margin-top:32px; padding:17px 18px; background:#f4faff; border:1px solid #dceef8; border-radius:9px;">

          <div style="display:flex; align-items:center; justify-content:space-between;">

            <span style="font-size:13px; color:#7390a2;">
              Service status
            </span>

            <span style="font-size:13px; font-weight:600; color:#1680b4;">
              Healthy
            </span>

          </div>

        </div>

      </div>

      <!-- Footer -->
      <div style="padding:18px 32px; background:#f5faff; border-top:1px solid #e0eef6;">

        <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">

          <span style="font-size:12px; color:#8ba3b3;">
            Flareminds Billing API
          </span>

          <span style="font-size:12px; color:#8ba3b3;">
            System operational
          </span>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
